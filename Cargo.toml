[workspace]
members = [
    "crates/cantools-core",
    "crates/cantools-codec",
    "crates/cantools-socketcan",
    "crates/cantools-dbc",
    "crates/cantools-isotp",
    "crates/cantools-j1939",
    "crates/cantools-uds",
    "crates/cantools-obd",
    "crates/cantools-cli",
    "crates/cantools-tui",
    "crates/xtask",
]
resolver = "2"

[workspace.package]
authors = ["Dylan Walker Brown <dylan@walkerbrown.org>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vehiclenet/cantools-rs"
rust-version = "1.91"
version = "0.1.0"

[workspace.dependencies]
ablf = "0.2.0"
anyhow = "1.0.102"
binrw = "0.13.4"
byteorder = "1.5.0"
can-dbc = "8.1.0"
clap = { version = "4.5.59", features = ["derive", "env"] }
clap_complete = "4.5.61"
clap_mangen = "0.2.31"
crossterm = "0.29.0"
libc = "0.2.182"
mf4-rs = "1.0.0"
ratatui = "0.30.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
toml = "0.9.10"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
